<!DOCTYPE html>
<html>
<head>
    <title>RPEPL Demo</title>
    <style>
        textarea { width: 100%; height: 200px; font-family: monospace; }
        #output { white-space: pre; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>RPEPL Demo</h1>
    <textarea id="code">ᚹᚨᛞᚨ ᛟᛗᛁ = XLII;</textarea>
    <button onclick="runCode()">Run</button>
    <div id="output"></div>
    <div id="variables"></div>
    
    <script src="../src/rpepl.js"></script>
    <script>
        const interpreter = new RPEPL();
        
        function runCode() {
            const code = document.getElementById('code').value;
            const result = interpreter.interpret(code);
            document.getElementById('output').textContent = result;
            document.getElementById('variables').textContent = 
                'Variables: ' + JSON.stringify(interpreter.variables, null, 2);
        }
    </script>
</body>
</html>
